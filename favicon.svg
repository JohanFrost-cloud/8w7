<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0a0a0e"/>
  
  <!-- Soft outer glow (animated) -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#c01010" stroke-width="1.5" opacity="0.35">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;27;24" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Bold geometric V - optimized to stay clear at 16px -->
  <path d="M14 14 L32 50 L50 14 L40 14 L32 36 L24 14 Z" fill="#c01010">
    <animate attributeName="fill" values="#c01010;#ff2a2a;#c01010" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- Tiny accent highlight for depth -->
  <path d="M24 14 L32 36 L40 14" fill="none" stroke="#ff5a5a" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
</svg>
